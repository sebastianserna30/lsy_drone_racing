# Deploy Multilevel

[controller]  # Add the controller files for each drone
file = "trajectory_mppi.py"
type = "mppi" # mellinger, mppi
ctrl_freq = 50 # Hz

[controller.mppi] # MPPI parameters
N = 30                     # rollout horizon in steps
T = 0.6                    # seconds, control horizon duration. Note that dt = T / horizon
n_samples = 100000         # total rollouts per step; must be divisible by K
noise_sigma = 0.01         # Initial noise std
temperature = 0.25         # MPPI softmax temperature
elite_percentage = 0.01    # Top percent for averaging in [0,1]
beta = 0.6                 # Noise smoothing in [0,1] (no smoothing to max smoothing)
alpha = 0.1                # weighted variance update weight
min_variance = 0.02
K = 5                      # means
action_ema = 0.4           # EMA blend on executed action: ema * new + (1-ema) * prev
agents = []                # per-agent overrides; empty means every agent shares the values above

# MPCC progress channel: the reference is keyed on arc length, and each rollout advances
# its own theta by a sampled v_theta (the 5th control channel).
v_theta_init = 2.0         # nominal forward progress speed (m/s) ~ path_length / t_total
v_theta_max = 6.0          # cap on progress speed
v_theta_sigma = 0.6        # exploration noise on v_theta (m/s)

[controller.mppi.cost] # ego cost weights
# contour = off-path (perpendicular) error; high to thread gate centres cleanly
contour = 20.0
# lag = along-path (ahead/behind theta) error; keeps theta synced to the drone
lag = 400.0
# progress = reward for advancing theta (the "go faster" term). Lower = calmer, safer.
progress = 1.0
z = 80.0                   # extra penalty for altitude error
ang_vel = 0.0              # angular-velocity penalty (off)
ang_acc = 0.0              # angular-acceleration penalty (off)
tilt = 1.0                 # was 5.0; loosened to allow aggressive roll/pitch
thrust = 1.0               # was 0.0; regularise toward hover thrust
yaw = 2.0                  # was 0.0; added to stabilise yaw oscillation
obstacle = 10000.0         # per-obstacle collision penalty
floor = 500.0              # penalty weight for states below floor_z
floor_z = 0.1              # height (m) below which the floor penalty applies

[controller.mppi.opponent]
model = "spline_progress"      # mppi | spline_progress | const_vel
pred_offset_tau = 0.5          # s; decay of the opponent's off-spline offset in the predictor
anchor_fwd = 0.1               # m; forward slack of the theta anchor search window
anchor_reacquire_dist = 0.75   # m; residual above which the anchor is re-acquired globally
match_pace = true              # drive the modelled opponent at its OBSERVED forward speed
drone_exp = 50                 # smooth opponent-collision weight (folded from mppi++_overtake; sweep: >=50 yields)
# Anisotropic opponent keep-out (overtake). Ellipse elongated ALONG the other drone's real
# velocity heading: being behind is costly, alongside is cheap -> sideways overtake.
use_anisotropic = true         # elongate the keep-out along the opponent's heading
axial = 0.25                   # fore/aft keep-out half-length (m)
lateral = 0.1                  # sideways keep-out half-width (m) ~2x drone_radius (actual collision dist)
core_radius = 0.18             # hard isotropic core (m) the aniso ellipse may never admit closer than
vel_ema = 0.3                  # EMA low-pass on the observed opponent velocity
blend_v0 = 0.2                 # iso<->aniso blend center (m/s); replaces the hard spd>0.2 switch
blend_width = 0.05             # blend width (m/s)
# Iterative best response (Nash): re-score the cached rollouts against each other until the
# choices stop moving. Only applies to model = "mppi", where opponents are simulated and so have
# a sample bank to respond with. NOTE this models the opponent as avoiding us as hard as we avoid
# it -- a real opponent that does not yield will not behave this way.
ibr_iters = 3                  # best-response passes; 0 = single unilateral response
ibr_mode = "scan"              # scan = Gauss-Seidel (converges) | vmap = Jacobi (can oscillate)
downwash = 1000.0              # below-opponent (wake) penalty — the sim does NOT model downwash!
downwash_radius = 0.3          # wake cylinder radius (m)
downwash_dz = 0.6              # wake depth below the opponent (m)
stale_inflate_rate = 1.0       # keep-out inflation per second of opponent-tracking staleness
stale_max = 0.5                # staleness cap (s) -> max inflation 1 + rate*cap

[controller.mppi.spline] # fixed reference-trajectory params (SplinePlanner)
t_total = 6.0              # was 5.0; target matches PPO lap time (3.20s)
curvature_weight = 2.0     # k=0.5 best per-segment match vs PPO (k>0.5 over-penalises the G0->G1 curve)
clearance = 0.22           # 0.16-0.21 flips obs3 detour to wrong side; 0.22 stays NE (path 7.74m, min_obs 0.21m)
lut_samples = 1500

[controller.mppi.geometry] # physical radii (m), moved here from [experiment.env]
drone_radius = 0.12        # 86mm + safety margin
obstacle_radius = 0.055    # 110mm diameter pipes
gate_frame_radius = 0.1

[sim]
# Physics options:
# "first_principles": first_principles (physics based) model
# "so_rpy": Simplified identified model.
# "so_rpy_rotor": Simplified identified model with rotor dynamics.
# "so_rpy_rotor_drag": Simplified identified model with rotor dynamics and drag.
physics = "first_principles"
drone_model = "cf21B_500"       # Model of the drone, i.e., cf2x_L250, cf2x_P250, cf2x_T500, cf21B_500. For this course, we use cf21B_500
freq = 500                      # Simulation frequency, in Hz
attitude_freq = 500             # Controller frequency, in Hz. This frequency is used to simulate the onboard controller, NOT for the environment's step function
render = true                   # Enable/disable Crazyflow's GUI
camera = -1                     # camera id or name, i.e., drone cam ids start at 0, cam names are "fpv_cam:0" or "track_cam:0", where the number is the drone id
[[sim.cam_config]]              # only used if camera == -1, i.e., world view is activated
distance = 5.0
azimuth = 180.0
elevation = -25.0
lookat = [0.0, 0.0, 0.0]

[env]
id = "MultiDroneRacing-v0"
seed = -1               # -1 for random seeds or a non-zero integer for reproducibility
freq = 50
sensor_range = 0.7
control_mode = "attitude"

[env.track]
# Full track radomization. When activated, the position (x & y) and orientation (yaw) 
# of the below given gates, obstacles and drones is randomized inside the safety limits. 
# Note: The order and therefore also height is not randomized!
randomize = false

# Tall gates: 1.195m height. Short gates: 0.695m height. Height is measured from the ground to the center of the gate.
# Gates are square. Gates are 0.72m wide (outer dimensions of the frame) with a 0.4m wide opening.
[[env.track.gates]]
pos = [0.5 , 0.25, 0.7]
rpy = [0.0, 0.0, -0.78]
[[env.track.gates]]
pos = [1.05, 0.75, 1.2]
rpy = [0.0, 0.0, 2.35]
[[env.track.gates]]
pos = [-1.0, -0.25, 0.7]
rpy = [0.0, 0.0, 3.14]
[[env.track.gates]]
pos = [0.0, -0.75, 1.2]
rpy = [0.0, 0.0, 0.0]

# Obstacle height: 1.52m + reflective marker on top. Height is measured from the ground to the top of the obstacle.
# Obstacles are cylinders with a diameter of 0.03m.
[[env.track.obstacles]]
pos = [0.0, 0.75, 1.55]
[[env.track.obstacles]]
pos = [1.0, 0.25, 1.55]
[[env.track.obstacles]]
pos = [-1.5, -0.25, 1.55]
[[env.track.obstacles]]
pos = [-0.5, -0.75, 1.55]

[[env.track.drones]]
pos = [-1.5, 0.75, 0.01]
rpy = [0.0, 0.0, 0.0]
vel = [0, 0, 0]
ang_vel = [0, 0, 0]

# If the drones exceed those bounds in real, the run will be stopped and the drone will safely be returned to the starting position
[env.track.safety_limits]
pos_limit_low = [-2.5, -1.5, -1e-3]
pos_limit_high = [2.5, 1.5, 2.0]

[env.disturbances.action]
fn = "normal"
scale = 0.001

[env.disturbances.dynamics]
fn = "uniform"
[env.disturbances.dynamics.kwargs]
minval = [-0.1, -0.1, -0.1]
maxval = [0.1, 0.1, 0.1]

[env.randomizations.drone_pos]
fn = "uniform"
[env.randomizations.drone_pos.kwargs]
minval = [-0.1, -0.1, 0.0]
maxval = [0.1, 0.1, 0.2]

[env.randomizations.drone_rpy]
fn = "uniform"
[env.randomizations.drone_rpy.kwargs]
minval = [-0.1, -0.1, -0.1]
maxval = [0.1, 0.1, 0.1]

#Everything for MPPI
[env.randomizations.drone_mass]
fn = "uniform"
[env.randomizations.drone_mass.kwargs]
minval = -0.005
maxval = 0.005

[env.randomizations.drone_inertia]
fn = "uniform"
[env.randomizations.drone_inertia.kwargs]
minval = [-0.000001, -0.000001, -0.000001]
maxval = [0.000001, 0.000001, 0.000001]

[env.randomizations.gate_pos]
fn = "uniform"
[env.randomizations.gate_pos.kwargs]
minval = [-0.05, -0.05, -0.1]
maxval = [0.05, 0.05, 0.1]

[env.randomizations.gate_rpy]
fn = "uniform"
[env.randomizations.gate_rpy.kwargs]
minval = [-0.05, -0.1, -0.2]
maxval = [0.05, 0.1, 0.2]

[env.randomizations.obstacle_pos]
fn = "uniform"
[env.randomizations.obstacle_pos.kwargs]
minval = [-0.05, -0.05, -0.05]
maxval = [0.05, 0.05, 0.05]

# [drone], [experiment] and [plot] removed: they were inherited from another framework. The
# only keys anything read were the radii (now [controller.mppi.geometry]) and drone.model
# (now sim.drone_model, which already held the same value).
